[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sloth-migrate"
version = "0.1.0"
description = "Autonomous dependency migration agent powered by Gemma 4 and Temporal."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohammad Tejabwala" }
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "pytest>=8.1.0",
]

[project.scripts]
sloth-migrate = "sloth_migrate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sloth_migrate"]