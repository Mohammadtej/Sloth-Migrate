[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sloth-migrate"
version = "0.1.0"
description = "Autonomous Python dependency migration agent powered by Gemma and Temporal."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mohammad Tejabwala" }
]
dependencies = [
    "typer[all]>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "temporalio>=1.6.0",
    "httpx>=0.27.0",
    "sentry-sdk[fastapi,httpx]>=2.8.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
sloth-migrate = "sloth_migrate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sloth_migrate"]